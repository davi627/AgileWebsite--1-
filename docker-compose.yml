services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${DB_NAME:-AgileWebsite}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://root:changeme@mongo:27017/AgileWebsite?authSource=admin}
      DB_NAME: ${DB_NAME:-AgileWebsite}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:5000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
    volumes:
      - uploads_data:/app/packages/apis/public/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  uploads_data:
